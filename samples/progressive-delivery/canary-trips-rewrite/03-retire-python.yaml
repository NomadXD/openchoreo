# Step 3: the rewrite took all the traffic and held it. Drop the Python
# backend from the Endpoint (a new release); its outside callers keep the same
# URL. Overrides that still name trips-python are ignored and reported in the
# binding's BackendOverridesApplied condition, so the release promotes as is.
# Move in-cluster callers off trips-python's own address, then delete the
# component.
apiVersion: openchoreo.dev/v1alpha1
kind: Endpoint
metadata:
  name: trips-api
  namespace: default
spec:
  owner:
    projectName: default
  type:
    kind: ClusterEndpointType
    name: http-progressive
  visibility: [external]
  autoDeploy: true
  parameters:
    pathPrefix: /trips
  backendRefs:
    - name: trips-go
      component: { name: trips-go, endpoint: http }
      weight: 100
